:root{
  color-scheme:dark;
  --bg:#04090B;
  --bg-2:#081317;
  --grid:#10242A;
  --line:#1E3C44;
  --dim:#4F7C86;
  --mid:#86BBC6;
  --ice:#B8F3FF;
  --glow:rgba(120,230,255,.45);
  --amber:#FFB547;
  --good:#6CFFA8;
  --bad:#FF7A6B;
  --display:"Chakra Petch","DIN Alternate","Avenir Next Condensed",ui-sans-serif,system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--bg);
  color:var(--ice);
  font-family:var(--mono);
  font-size:12px;
  -webkit-font-smoothing:antialiased;
  -webkit-tap-highlight-color:transparent;
  -webkit-user-select:none;user-select:none;
  overflow:hidden;
  overscroll-behavior:none;
}
/* HUD backdrop: fine grid + vignette + scanlines */
.backdrop{position:fixed;inset:0;pointer-events:none;z-index:0;
  background:
    radial-gradient(120% 80% at 50% 42%, transparent 40%, rgba(0,0,0,.65) 100%),
    repeating-linear-gradient(0deg, rgba(184,243,255,.025) 0 1px, transparent 1px 3px),
    linear-gradient(var(--grid) 1px, transparent 1px) 0 0/28px 28px,
    linear-gradient(90deg, var(--grid) 1px, transparent 1px) 0 0/28px 28px,
    var(--bg);
  opacity:.9}

.app{
  position:relative;z-index:1;height:100%;
  display:grid;grid-template-rows:auto 1fr auto auto;gap:14px;
  padding:calc(env(safe-area-inset-top,0px) + 14px) 18px calc(env(safe-area-inset-bottom,0px) + 14px);
}

/* top bar */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;
  font-family:var(--display);font-weight:500;letter-spacing:.22em;font-size:11px;color:var(--mid);text-transform:uppercase}
.brand{display:flex;align-items:center;gap:10px}
.brand svg{width:18px;height:18px}
.ver{font-family:var(--mono);font-size:9.5px;letter-spacing:.12em;color:var(--dim);text-transform:none}
/* accuracy tiers: <=10 good, 11-20 default, 21-50 warn, >50 or missing bad */
.sub .acc,.sub .acc b{transition:color .3s,text-shadow .3s}
.sub .acc.good,.sub .acc.good b{color:var(--good);text-shadow:0 0 8px rgba(108,255,168,.45)}
.sub .acc.warn,.sub .acc.warn b{color:var(--amber);text-shadow:0 0 8px rgba(255,181,71,.35)}
.sub .acc.bad,.sub .acc.bad b{color:var(--bad);text-shadow:0 0 8px rgba(255,122,107,.35)}
.status{display:flex;align-items:center;gap:8px;padding:5px 10px 5px 9px;border:1px solid var(--line);
  font-family:var(--mono);letter-spacing:.12em;font-size:10px;color:var(--mid);background:rgba(4,9,11,.6)}
.dot{width:7px;height:7px;border-radius:50%;background:var(--dim)}
.status[data-state="lock"] .dot{background:var(--ice);box-shadow:0 0 8px var(--glow);animation:pulse 2s ease-in-out infinite}
.status[data-state="lock"]{color:var(--ice);border-color:var(--dim)}
.status[data-state="search"] .dot,.status[data-state="demo"] .dot,.status[data-state="error"] .dot{background:var(--amber)}
.status[data-state="search"],.status[data-state="demo"],.status[data-state="error"]{color:var(--amber);border-color:rgba(255,181,71,.4)}
.status[data-state="search"] .dot{animation:pulse 1s steps(2) infinite}
.status[data-state="hold"]{color:var(--bg);background:var(--ice);border-color:var(--ice)}
.status[data-state="hold"] .dot{background:var(--bg)}
@keyframes pulse{50%{opacity:.25}}

/* main readout */
.main{position:relative;display:grid;grid-template-columns:1fr 46px;gap:10px;min-height:0}
.readout{position:relative;display:flex;flex-direction:column;justify-content:center;padding:18px 12px;min-width:0}
.corner{position:absolute;width:22px;height:22px;border-color:var(--mid);border-style:solid;opacity:.8}
.c-tl{top:0;left:0;border-width:1.5px 0 0 1.5px}
.c-tr{top:0;right:0;border-width:1.5px 1.5px 0 0}
.c-bl{bottom:0;left:0;border-width:0 0 1.5px 1.5px}
.c-br{bottom:0;right:0;border-width:0 1.5px 1.5px 0}
.label{font-family:var(--display);font-weight:500;font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:var(--dim)}
.alt-row{display:flex;align-items:flex-end;gap:6px;margin-top:6px;min-width:0}
.alt{
  font-family:var(--display);font-weight:600;
  font-size:clamp(72px, 24vw, 200px);line-height:.86;letter-spacing:-.02em;
  font-variant-numeric:tabular-nums;color:var(--ice);
  text-shadow:0 0 18px var(--glow),0 0 2px rgba(255,255,255,.6);
  white-space:nowrap;
}
.alt.dim{color:var(--dim);text-shadow:none}
.unit{font-family:var(--display);font-weight:600;font-size:clamp(22px,6vw,44px);color:var(--mid);padding-bottom:.25em}
.sub{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:14px;color:var(--mid);font-size:11px;letter-spacing:.06em}
.sub b{font-weight:400;color:var(--ice)}
.msg{margin-top:12px;color:var(--amber);font-size:11px;line-height:1.5;letter-spacing:.02em;max-width:34ch}

/* altitude tape */
.tape{position:relative;border-left:1px solid var(--line);min-height:0}
.tape canvas{position:absolute;inset:0;width:100%;height:100%}
.tape .pointer{position:absolute;left:-1px;top:50%;width:14px;height:14px;transform:translate(-100%,-50%);
  clip-path:polygon(0 0,100% 50%,0 100%);background:var(--ice);filter:drop-shadow(0 0 4px var(--glow))}

/* data grid */
.data{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid var(--line);border-left:1px solid var(--line)}
.cell{padding:10px 12px 11px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);min-width:0;background:rgba(4,9,11,.55)}
.cell .label{font-size:9.5px;letter-spacing:.2em;display:flex;justify-content:space-between;gap:6px}
.cell .label i{font-style:normal;color:var(--dim);opacity:.8;letter-spacing:.1em}
.val{margin-top:5px;font-family:var(--display);font-weight:600;font-size:clamp(20px,6.2vw,30px);line-height:1;font-variant-numeric:tabular-nums;color:var(--ice);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.val small{font-size:.5em;font-weight:500;color:var(--mid);margin-left:3px;letter-spacing:.06em}
.bar{margin-top:8px;height:3px;background:var(--grid);position:relative}
.bar span{position:absolute;inset:0 auto 0 0;background:var(--mid);width:0;transition:width .6s ease}

[hidden]{display:none!important}

/* location */
.loc{grid-column:1/-1}
.loc .label{align-items:center}
.loc-tags{display:flex;align-items:center;gap:8px}
.loc-tags i{font-style:normal;letter-spacing:.14em}
.loc-tags i[data-src="offline"]{color:var(--bad);opacity:1;text-shadow:0 0 8px rgba(255,122,107,.35)}
.loc-tags i[data-src="online"]{color:var(--good);opacity:1;text-shadow:0 0 8px rgba(108,255,168,.45)}
button.keybtn{padding:3px 7px;font-size:9px;letter-spacing:.16em;border-color:var(--line);color:var(--dim)}
.loc-main{margin-top:6px;font-family:var(--display);font-weight:600;font-size:clamp(18px,5.4vw,24px);line-height:1.15;color:var(--ice);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.loc-main .zh{font-family:"PingFang SC","Hiragino Sans GB",system-ui,sans-serif;font-weight:500;margin-left:8px}
.loc-sub,.loc-online{margin-top:4px;font-size:11px;line-height:1.45;color:var(--mid);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.loc-sub .zh,.loc-online{font-family:"PingFang SC","Hiragino Sans GB",var(--mono)}
.loc-online{color:var(--ice)}
.loc-online.err{color:var(--amber)}
.keyform{display:flex;gap:6px;margin-top:8px}
.keyform input{flex:1;min-width:0;font:12px var(--mono);color:var(--ice);background:var(--bg);border:1px solid var(--line);padding:8px;-webkit-user-select:text;user-select:text}
.keyform button{padding:8px 10px;font-size:10px}

/* controls */
.controls{display:grid;grid-template-columns:1fr 1fr;gap:10px}
button{
  appearance:none;border:1px solid var(--line);background:rgba(8,19,23,.8);color:var(--mid);
  font-family:var(--display);font-weight:600;font-size:12px;letter-spacing:.22em;text-transform:uppercase;
  padding:13px 10px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;
}
button[aria-pressed="true"]{background:var(--ice);color:var(--bg);border-color:var(--ice);box-shadow:0 0 14px var(--glow)}
button:focus-visible{outline:1.5px solid var(--ice);outline-offset:2px}
button:active{transform:translateY(1px)}

@media (max-height:640px){
  .alt{font-size:clamp(72px,22vw,160px)}
  .data .bar{display:none}
  .app{gap:10px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="backdrop" aria-hidden="true"></div>
<main class="app">
  <header class="top">
    <div class="brand">
      <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M2 20 9 7l4 7 3-4 6 10H2Z" stroke="#86BBC6" stroke-width="1.6" stroke-linejoin="round"/><path d="M9 7l1.6 3" stroke="#B8F3FF" stroke-width="1.6"/></svg>
      <span>Altimeter</span>
      <span class="ver" id="ver"></span>
    </div>
    <div class="status" id="status" data-state="search" role="status" aria-live="polite"><span class="dot"></span><span id="statusText">SEARCHING</span></div>
  </header>

  <section class="main">
    <div class="readout">
      <span class="corner c-tl"></span><span class="corner c-tr"></span><span class="corner c-bl"></span><span class="corner c-br"></span>
      <div class="label">Altitude · above sea level</div>
      <div class="alt-row"><div class="alt" id="alt">----</div><div class="unit">M</div></div>
      <div class="sub">
        <span class="acc" id="vaccWrap">V-ACC <b id="vacc">±--</b> m</span>
        <span class="acc" id="haccWrap">H-ACC <b id="hacc">±--</b> m</span>
        <span>FIX <b id="age">--</b></span>
      </div>
      <div class="msg" id="msg" hidden></div>
    </div>
    <div class="tape" aria-hidden="true"><canvas id="tape"></canvas><div class="pointer"></div></div>
  </section>

  <section class="data">
    <div class="cell loc" id="locCell">
      <div class="label">Location <span class="loc-tags"><i id="locSrc" data-src="offline">offline</i><button type="button" class="keybtn" id="keyBtn" aria-expanded="false">Key</button></span></div>
      <div class="loc-main" id="locMain">--</div>
      <div class="loc-sub" id="locSub"></div>
      <div class="loc-online" id="locOnline" hidden></div>
      <form class="keyform" id="keyForm" hidden>
        <input id="keyInput" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Amap Web Service key">
        <button type="submit">Save</button><button type="button" id="keyClear">Clear</button>
      </form>
    </div>
    <div class="cell"><div class="label">Latitude</div><div class="val" id="lat">--</div></div>
    <div class="cell"><div class="label">Longitude</div><div class="val" id="lon">--</div></div>
    <div class="cell"><div class="label">Pressure <i>ISA est.</i></div><div class="val" id="pres">--<small>hPa</small></div><div class="bar"><span id="presBar"></span></div></div>
    <div class="cell"><div class="label">O₂ vs sea level <i>est.</i></div><div class="val" id="o2">--<small>%</small></div><div class="bar"><span id="o2Bar"></span></div></div>
  </section>

  <nav class="controls">
    <button id="holdBtn" type="button" aria-pressed="false">Hold</button>
    <button id="wakeBtn" type="button" aria-pressed="false">Screen on</button>
  </nav>
</main>

<script>
(() => {
  const VERSION = 'v1.0.0';
  const $ = id => document.getElementById(id);
  const els = {alt:$('alt'),vacc:$('vacc'),vaccWrap:$('vaccWrap'),hacc:$('hacc'),haccWrap:$('haccWrap'),age:$('age'),lat:$('lat'),lon:$('lon'),pres:$('pres'),o2:$('o2'),
    presBar:$('presBar'),o2Bar:$('o2Bar'),status:$('status'),statusText:$('statusText'),msg:$('msg'),
    hold:$('holdBtn'),wake:$('wakeBtn'),tape:$('tape')};
  const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

  const P0 = 1013.25; // hPa, ISA sea level
  const pressureAt = h => P0 * Math.pow(1 - 2.25577e-5 * h, 5.25588);

  let shown = null;        // altitude currently drawn (animated)
  let target = null;       // altitude to show
  let lastFix = 0;
  let held = false;
  let mode = 'search';
  const recent = [];       // recent altitude samples for median smoothing

  const fmtInt = n => Math.round(n).toLocaleString('en-US');
  const fmtCoord = (v, pos, neg) => Math.abs(v).toFixed(5) + '°' + (v >= 0 ? pos : neg);

  let modeText = 'SEARCHING';
  function setStatus(state, text){
    mode = state; modeText = text;
    els.status.dataset.state = held ? 'hold' : state;
    els.statusText.textContent = held ? 'HOLD' : text;
  }
  function setMsg(t){ els.msg.hidden = !t; els.msg.textContent = t || ''; }

  // tier uses the rounded value shown on screen
  function showAcc(valEl, wrapEl, v){
    const r = v != null && isFinite(v) ? Math.round(v) : null;
    valEl.textContent = r != null ? '±' + r : '±--';
    const tier = r == null ? 'bad' : r <= 10 ? 'good' : r <= 20 ? '' : r <= 50 ? 'warn' : 'bad';
    wrapEl.classList.remove('good', 'warn', 'bad');
    if (tier) wrapEl.classList.add(tier);
  }

  function render(d){
    target = d.alt;
    showAcc(els.vacc, els.vaccWrap, d.vacc);
    showAcc(els.hacc, els.haccWrap, d.hacc);
    els.lat.textContent = fmtCoord(d.lat, 'N', 'S');
    els.lon.textContent = fmtCoord(d.lon, 'E', 'W');
    place.update(d.lat, d.lon, d.hacc);
    if (d.alt != null){
      const p = pressureAt(Math.max(d.alt, -500));
      const r = p / P0;
      els.pres.innerHTML = Math.round(p) + '<small>hPa</small>';
      els.o2.innerHTML = Math.round(r * 100) + '<small>%</small>';
      els.presBar.style.width = els.o2Bar.style.width = Math.min(100, r * 100) + '%';
    }
    els.alt.classList.toggle('dim', d.alt == null);
    if (d.alt == null){ els.alt.textContent = '----'; shown = null; }
  }

  // number tween
  function tick(){
    if (target != null){
      if (shown == null || reduceMotion) shown = target;
      else shown += (target - shown) * 0.18;
      if (Math.abs(target - shown) < 0.5) shown = target;
      els.alt.textContent = fmtInt(shown);
    }
    drawTape(shown);
    if (lastFix){
      const s = Math.round((Date.now() - lastFix) / 1000);
      els.age.textContent = s < 60 ? s + 's ago' : Math.floor(s / 60) + 'm ago';
    }
    requestAnimationFrame(tick);
  }

  // altitude tape
  const ctx = els.tape.getContext('2d');
  function drawTape(alt){
    const c = els.tape, dpr = window.devicePixelRatio || 1;
    const w = c.clientWidth, h = c.clientHeight;
    if (c.width !== Math.round(w * dpr) || c.height !== Math.round(h * dpr)){ c.width = Math.round(w * dpr); c.height = Math.round(h * dpr); }
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, w, h);
    if (alt == null) alt = 0;
    const pxPerM = 0.6;               // 100 m = 60 px
    const mid = h / 2;
    const span = mid / pxPerM + 100;
    const start = Math.floor((alt - span) / 20) * 20;
    ctx.font = '500 10px "Chakra Petch", ui-sans-serif, sans-serif';
    ctx.textBaseline = 'middle';
    for (let m = start; m <= alt + span; m += 20){
      const y = mid - (m - alt) * pxPerM;
      if (y < -10 || y > h + 10) continue;
      const fade = 1 - Math.min(1, Math.abs(y - mid) / mid) * 0.85;
      const major = m % 100 === 0;
      ctx.globalAlpha = fade;
      ctx.fillStyle = major ? '#86BBC6' : '#1E3C44';
      ctx.fillRect(0, Math.round(y), major ? 14 : 7, 1);
      if (major){
        ctx.fillStyle = '#4F7C86';
        ctx.fillText((m / 1000).toFixed(1) + 'k', 18, y);
      }
    }
    ctx.globalAlpha = 1;
  }

  // ---------- place lookup ----------
  // Offline: county polygons (AreaCity ok_geo.csv, WGS-84) + nearest GeoNames town.
  // Online (optional): Amap reverse geocoding with the user's own key, stored only on this device.
  const place = (() => {
    const KEY = 'altimeter.amapKey';
    const $l = {main: $('locMain'), sub: $('locSub'), online: $('locOnline'), src: $('locSrc'),
      btn: $('keyBtn'), form: $('keyForm'), input: $('keyInput'), clear: $('keyClear')};
    let counties = null, towns = null, cur = null, lastCalc = null, offline = null;
    let online = null, onlineErr = '', lastLookup = null, inflight = false;

    const toR = Math.PI / 180;
    function distKm(a1, o1, a2, o2){
      const dA = (a2 - a1) * toR, dO = (o2 - o1) * toR;
      const h = Math.sin(dA / 2) ** 2 + Math.cos(a1 * toR) * Math.cos(a2 * toR) * Math.sin(dO / 2) ** 2;
      return 12742 * Math.asin(Math.sqrt(h));
    }
    function compass(a1, o1, a2, o2){ // direction from point 1 to point 2
      const y = Math.sin((o2 - o1) * toR) * Math.cos(a2 * toR);
      const x = Math.cos(a1 * toR) * Math.sin(a2 * toR) - Math.sin(a1 * toR) * Math.cos(a2 * toR) * Math.cos((o2 - o1) * toR);
      const deg = (Math.atan2(y, x) / toR + 360) % 360;
      return ['N','NE','E','SE','S','SW','W','NW'][Math.round(deg / 45) % 8];
    }
    function getKey(){ if (window.__ALT_MOCK_REGEO) return 'mock'; try { return localStorage.getItem(KEY) || ''; } catch(_) { return ''; } }
    function setKey(k){ try { k ? localStorage.setItem(KEY, k) : localStorage.removeItem(KEY); } catch(_) {} }

    function decode(d){
      return d.u.map(u => {
        let b = [1e9, 1e9, -1e9, -1e9];
        const rings = u.r.map(enc => {
          const p = new Float64Array(enc.length); let x = 0, y = 0;
          for (let i = 0; i < enc.length; i += 2){
            x += enc[i]; y += enc[i + 1]; p[i] = x / 1000; p[i + 1] = y / 1000;
            if (p[i] < b[0]) b[0] = p[i]; if (p[i] > b[2]) b[2] = p[i];
            if (p[i + 1] < b[1]) b[1] = p[i + 1]; if (p[i + 1] > b[3]) b[3] = p[i + 1];
          }
          return p;
        });
        return {n: u.n, p: u.p, py: u.py, rings, b};
      });
    }
    function inRing(p, x, y){
      let c = false;
      for (let i = 0, j = p.length - 2; i < p.length; j = i, i += 2){
        const xi = p[i], yi = p[i + 1], xj = p[j], yj = p[j + 1];
        if ((yi > y) !== (yj > y) && x < (xj - xi) * (y - yi) / (yj - yi) + xi) c = !c;
      }
      return c;
    }
    function findCounty(lat, lon){
      for (const u of counties){
        const b = u.b;
        if (lon < b[0] || lon > b[2] || lat < b[1] || lat > b[3]) continue;
        for (const r of u.rings) if (inRing(r, lon, lat)) return u;
      }
      return null;
    }
    function nearestTown(lat, lon){
      let best = null, bd = Infinity; const k = Math.cos(lat * toR);
      for (const t of towns){ const dy = t[2] - lat, dx = (t[3] - lon) * k, d = dx * dx + dy * dy; if (d < bd){ bd = d; best = t; } }
      if (!best) return null;
      return {en: best[0], zh: best[1], km: distKm(best[2], best[3], lat, lon), dir: compass(best[2], best[3], lat, lon)};
    }

    function span(cls, text){ const e = document.createElement('span'); if (cls) e.className = cls; e.textContent = text; return e; }
    function draw(){
      const o = offline;
      $l.main.replaceChildren(); $l.sub.replaceChildren();
      if (!counties){ $l.main.textContent = cur ? 'Loading place data…' : '--'; }
      else if (o && o.county){
        $l.main.append(o.county.py.toUpperCase(), span('zh', o.county.n));
        const path = o.county.p.filter((v, i, a) => a.indexOf(v) === i).join(' · ');
        $l.sub.append(span('zh', path));
      } else if (o){ $l.main.textContent = 'Outside county data'; }
      else { $l.main.textContent = '--'; }
      if (o && o.town && o.town.km <= 30){
        const km = o.town.km < 1 ? '<1' : o.town.km < 10 ? o.town.km.toFixed(1) : Math.round(o.town.km);
        if ($l.sub.childNodes.length) $l.sub.append(' · ');
        $l.sub.append(km + ' km ' + o.town.dir + ' of ' + o.town.en);
        if (o.town.zh) $l.sub.append(span('zh', ' ' + o.town.zh));
      }
      const useOnline = online && cur && distKm(online.lat, online.lon, cur.lat, cur.lon) < 0.5;
      $l.src.textContent = useOnline ? 'online' : 'offline';
      $l.src.dataset.src = useOnline ? 'online' : 'offline';
      $l.online.classList.toggle('err', !!onlineErr && !useOnline);
      if (useOnline){
        const bits = [online.town, online.near ? online.near + (online.nearM != null ? ' ' + online.nearM + ' m' : '') : ''].filter(Boolean);
        $l.online.textContent = bits.join(' · ') || online.addr || '';
        $l.online.hidden = !$l.online.textContent;
      } else if (onlineErr){
        $l.online.textContent = 'Amap: ' + onlineErr; $l.online.hidden = false;
      } else { $l.online.hidden = true; }
    }

    function wgs2gcj(lat, lon){
      if (lon < 72.004 || lon > 137.8347 || lat < 0.8293 || lat > 55.8271) return [lat, lon];
      const a = 6378245.0, ee = 0.00669342162296594323, x = lon - 105, y = lat - 35;
      let dLat = -100 + 2 * x + 3 * y + 0.2 * y * y + 0.1 * x * y + 0.2 * Math.sqrt(Math.abs(x));
      dLat += (20 * Math.sin(6 * x * Math.PI) + 20 * Math.sin(2 * x * Math.PI)) * 2 / 3;
      dLat += (20 * Math.sin(y * Math.PI) + 40 * Math.sin(y / 3 * Math.PI)) * 2 / 3;
      dLat += (160 * Math.sin(y / 12 * Math.PI) + 320 * Math.sin(y * Math.PI / 30)) * 2 / 3;
      let dLon = 300 + x + 2 * y + 0.1 * x * x + 0.1 * x * y + 0.1 * Math.sqrt(Math.abs(x));
      dLon += (20 * Math.sin(6 * x * Math.PI) + 20 * Math.sin(2 * x * Math.PI)) * 2 / 3;
      dLon += (20 * Math.sin(x * Math.PI) + 40 * Math.sin(x / 3 * Math.PI)) * 2 / 3;
      dLon += (150 * Math.sin(x / 12 * Math.PI) + 300 * Math.sin(x / 30 * Math.PI)) * 2 / 3;
      const rl = lat * toR; let m = Math.sin(rl); m = 1 - ee * m * m; const sm = Math.sqrt(m);
      dLat = dLat * 180 / ((a * (1 - ee)) / (m * sm) * Math.PI);
      dLon = dLon * 180 / (a / sm * Math.cos(rl) * Math.PI);
      return [lat + dLat, lon + dLon];
    }
    function regeo(lat, lon){
      if (window.__ALT_MOCK_REGEO) return Promise.resolve(window.__ALT_MOCK_REGEO(lat, lon));
      return new Promise((resolve, reject) => {
        const [glat, glon] = wgs2gcj(lat, lon);
        const cb = '__amapCb' + Date.now(), s = document.createElement('script');
        const done = () => { clearTimeout(t); delete window[cb]; s.remove(); };
        const t = setTimeout(() => { done(); reject(new Error('timeout')); }, 8000);
        window[cb] = d => { done(); resolve(d); };
        s.onerror = () => { done(); reject(new Error('network')); };
        s.src = 'https://restapi.amap.com/v3/geocode/regeo?key=' + encodeURIComponent(getKey()) +
          '&location=' + glon.toFixed(6) + ',' + glat.toFixed(6) + '&extensions=all&radius=1000&output=JSON&callback=' + cb;
        document.head.appendChild(s);
      });
    }
    const str = v => typeof v === 'string' ? v : '';
    function lookupOnline(){
      if (!cur || !getKey() || inflight || navigator.onLine === false) return;
      if (cur.acc != null && cur.acc > 200) return;
      if (lastLookup && distKm(lastLookup.lat, lastLookup.lon, cur.lat, cur.lon) < 0.3 && Date.now() - lastLookup.time < 600000) return;
      inflight = true; const at = {lat: cur.lat, lon: cur.lon, time: Date.now()}; lastLookup = at;
      regeo(at.lat, at.lon).then(d => {
        if (d && d.status === '1' && d.regeocode){
          const r = d.regeocode, ac = r.addressComponent || {}, aoi = (r.aois || [])[0], poi = (r.pois || [])[0];
          online = {lat: at.lat, lon: at.lon, town: str(ac.township),
            near: aoi ? str(aoi.name) : poi ? str(poi.name) : '',
            nearM: !aoi && poi && poi.distance !== '' && !isNaN(+poi.distance) ? Math.round(+poi.distance) : null,
            addr: str(r.formatted_address)};
          onlineErr = '';
        } else { onlineErr = (d && d.info) ? String(d.info) : 'lookup failed'; }
      }).catch(() => { if (lastLookup) lastLookup.time = Date.now() - 540000; })   // network failure: retry in ~1 min
        .finally(() => { inflight = false; draw(); });
    }

    function update(lat, lon, acc){
      if (lat == null || lon == null) return;
      cur = {lat, lon, acc};
      if (counties && (!lastCalc || distKm(lastCalc.lat, lastCalc.lon, lat, lon) > 0.05)){
        lastCalc = {lat, lon};
        offline = {county: findCounty(lat, lon), town: towns && towns.length ? nearestTown(lat, lon) : null};
      }
      draw(); lookupOnline();
    }
    function load(){
      const pre = window.__ALT_DATA;
      const get = n => pre ? Promise.resolve(pre[n]) : fetch('places/' + n + '.json').then(r => { if (!r.ok) throw new Error(r.status); return r.json(); });
      Promise.all([get('counties'), get('towns')]).then(([c, t]) => {
        counties = decode(c); towns = t.t; lastCalc = null;
        if (cur) update(cur.lat, cur.lon, cur.acc); else draw();
      }).catch(() => { $l.main.textContent = 'Place data unavailable'; });
    }

    $l.btn.addEventListener('click', () => {
      const open = $l.form.hidden; $l.form.hidden = !open; $l.btn.setAttribute('aria-expanded', open);
      if (open){ $l.input.value = getKey() === 'mock' ? '' : getKey(); $l.input.focus(); }
    });
    $l.form.addEventListener('submit', e => {
      e.preventDefault(); setKey($l.input.value.trim()); $l.form.hidden = true; $l.btn.setAttribute('aria-expanded', 'false');
      online = null; onlineErr = ''; lastLookup = null; lookupOnline(); draw();
    });
    $l.clear.addEventListener('click', () => { setKey(''); $l.input.value = ''; online = null; onlineErr = ''; draw(); });
    addEventListener('online', lookupOnline);

    load();
    return {update};
  })();

  function median(a){ const s = [...a].sort((x, y) => x - y); const n = s.length; return n % 2 ? s[(n - 1) / 2] : (s[n / 2 - 1] + s[n / 2]) / 2; }

  function onPos(pos){
    const c = pos.coords;
    lastFix = Date.now();
    if (held) return;
    if (c.altitude == null){
      setStatus('error', 'NO ALTITUDE');
      setMsg('Position found, but no altitude yet. Altitude needs a real GPS fix: go outdoors and turn on Precise Location for Safari.');
      render({alt: null, vacc: null, hacc: c.accuracy, lat: c.latitude, lon: c.longitude});
      return;
    }
    recent.push(c.altitude); if (recent.length > 5) recent.shift();
    setStatus('lock', 'GPS LOCK');
    setMsg('');
    render({alt: median(recent), vacc: c.altitudeAccuracy, hacc: c.accuracy, lat: c.latitude, lon: c.longitude});
  }

  function showDemo(reason){
    setStatus('demo', 'DEMO DATA');
    setMsg(reason);
    render({alt: 4718, vacc: 6, hacc: 4, lat: 30.70312, lon: 90.63418});
  }

  function onErr(e){
    if (lastFix) { setStatus('error', 'SIGNAL LOST'); return; }
    const why = e && e.code === 1
      ? 'Location permission denied. Allow location for this site in Settings › Privacy › Location Services › Safari Websites, then reload. Sample values shown.'
      : 'Waiting for GPS. Sample values shown until a fix arrives.';
    showDemo(why);
  }

  function start(){
    if (!('geolocation' in navigator)){ showDemo('This browser has no location access. Sample values shown.'); return; }
    setStatus('search', 'SEARCHING');
    navigator.geolocation.watchPosition(onPos, onErr, {enableHighAccuracy: true, maximumAge: 0, timeout: 20000});
  }

  // hold: freeze the reading for a photo
  els.hold.addEventListener('click', () => {
    held = !held;
    els.hold.setAttribute('aria-pressed', held);
    els.hold.textContent = held ? 'Release' : 'Hold';
    setStatus(mode, modeText);
  });

  // keep the screen awake
  let lock = null;
  async function setWake(on){
    try{
      if (on){ lock = await navigator.wakeLock.request('screen'); lock.addEventListener('release', () => { if (!document.hidden) syncWake(false); }); }
      else if (lock){ await lock.release(); lock = null; }
      syncWake(on);
    }catch(_){ syncWake(false); els.wake.textContent = 'Not supported'; setTimeout(() => els.wake.textContent = 'Screen on', 1800); }
  }
  function syncWake(on){ els.wake.setAttribute('aria-pressed', on); }
  els.wake.addEventListener('click', () => setWake(els.wake.getAttribute('aria-pressed') !== 'true'));
  document.addEventListener('visibilitychange', () => { if (!document.hidden && els.wake.getAttribute('aria-pressed') === 'true') setWake(true); });

  // offline support
  if ('serviceWorker' in navigator && location.protocol === 'https:'){
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }

  $('ver').textContent = VERSION;
  showAcc(els.vacc, els.vaccWrap, null); showAcc(els.hacc, els.haccWrap, null);
  requestAnimationFrame(tick);
  start();
})();
</script>
</body>
</html>
